[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sparkyfitness-homeassistant"
version = "0.3.0"
description = "Home Assistant custom integration for SparkyFitness over MCP"
readme = "README.md"
requires-python = ">=3.14.2"
license = {file = "LICENSE"}

[project.optional-dependencies]
test = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "pytest-homeassistant-custom-component>=0.13.220",
  "ruff>=0.12.0"
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["custom_components/sparkyfitness"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["A", "ASYNC", "B", "C4", "E", "F", "I", "LOG", "PIE", "RUF", "SIM", "UP", "W"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.sparkyfitness"]
